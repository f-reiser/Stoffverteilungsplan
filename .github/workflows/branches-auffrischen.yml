name: Branches auffrischen

# Bringt offene Branches per echtem Rebase auf den Stand ihrer Basis - bei
# jedem Merge nach main (damit eine Abhaengigkeitskette sofort nachzieht,
# siehe git-branch-strategie -> "Blockierte Issues") und einmal naechtlich.
# Claude startet nur, wenn ein echter Konflikt bleibt (f-reiser/reiser-flow#7).

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  branches-auffrischen:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch)
    uses: f-reiser/reiser-flow/.github/workflows/branches-auffrischen.yml@7409a64452c6a9bff47d6b8ba061d5ebf6271e58  # v2.3.0
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

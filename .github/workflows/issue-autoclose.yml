name: Issue automatisch schliessen

# Schliesst ein offenes Issue, sobald ein Pull Request auf dessen
# issue-<nr>-*-Branch vom Maintainer-Konto gemergt wurde. Ein geschlossener,
# nicht gemergter Pull Request schliesst nie automatisch ein Issue.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  issue-autoclose:
    uses: f-reiser/reiser-flow/.github/workflows/issue-autoclose.yml@7409a64452c6a9bff47d6b8ba061d5ebf6271e58  # v2.3.0
    with:
      maintainer-login: ${{ vars.MAINTAINER_LOGIN }}

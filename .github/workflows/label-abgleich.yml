name: Label-Abgleich

# Bindet den wiederverwendbaren Workflow aus reiser-flow ein: bringt den
# Label-Katalog aus reiser-flow (.github/labels.json dort) in dieses
# Repository - Farbe, Beschreibung, Umbenennung und Loeschung nicht mehr
# gefuehrter Label inklusive. Siehe f-reiser/reiser-flow#54.
#
# Ausgeloest nur ueber "push:" auf diese Datei oder von Hand
# (workflow_dispatch) - kein "schedule:". Ob und wann der "@reiser-flow--v..."-
# Tag unten auf eine neuere Fassung nachgezogen wird, gehoert zu einem noch
# offenen Upgrade-Mechanismus (f-reiser/reiser-flow#54, Kommentar vom
# 20.09.2026) - bis der steht, stoesst der Nutzer den Abgleich gezielt an.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/label-abgleich.yml
  workflow_dispatch:

jobs:
  label-abgleich:
    uses: f-reiser/reiser-flow/.github/workflows/label-abgleich.yml@reiser-flow--v2.0.0
    permissions:
      issues: write

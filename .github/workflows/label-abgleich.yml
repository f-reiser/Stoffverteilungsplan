name: Label-Abgleich

# NUR UEBERGANGSWEISE HIER. Bringt den Label-Katalog aus reiser-flow
# (.github/labels.json dort) auf den aktuellen Stand - Farbe, Beschreibung,
# Umbenennung und Loeschung nicht mehr gefuehrter Label inklusive. Kein
# "schedule:": ob und wann dieses Projekt seinen "@<tag>" auf eine neuere
# Fassung von reiser-flow nachzieht, ist noch ein manueller Schritt (siehe die
# uebrigen Workflow-Dateien hier), und erst dann ist ein neuer Abgleich noetig.
#
# Sobald f-reiser/reiser-flow#54 einen automatisierten Upgrade-Mechanismus
# liefert, der diesen Abgleich selbst anstoesst: diese Datei ersatzlos
# entfernen, nicht migrieren - der Nutzer will sie nur bis dahin, nicht als
# Dauereinrichtung neben dem neuen Mechanismus.

on:
  push:
    branches: [main]
    paths: [.github/workflows/label-abgleich.yml]
  workflow_dispatch:

jobs:
  label-abgleich:
    uses: f-reiser/reiser-flow/.github/workflows/label-abgleich.yml@7409a64452c6a9bff47d6b8ba061d5ebf6271e58  # v2.3.0
    permissions:
      issues: write

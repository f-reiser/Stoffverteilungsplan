name: Label-Waechter

# Nimmt Steuerlabel zurueck, die nicht von einem Konto mit Admin- oder
# Maintainer-Recht kamen, und setzt die Scoped-Label-Exklusivitaet durch (pro
# Scope hoechstens ein Wert). Welche Label das sind und wer sie setzen darf,
# steht in f-reiser/reiser-flow - die Regel ist projektunabhaengig, also gehoert
# sie nicht in dieses Repository.
#
# pull_request_target statt pull_request: Bei einem Pull Request aus einem Fork
# bekaeme pull_request nur einen Lesetoken und koennte das Label nicht wieder
# abnehmen. Hier wird deshalb NICHTS ausgecheckt - der aufgerufene Workflow holt
# nur seine eigenen Skripte und arbeitet sonst ueber die API. Ein "ref:" auf den
# Kopf des Pull Request duerfte hier nie stehen: Das liesse fremden Fork-Code auf
# einem Runner mit Schreibrechten laufen.
#
# Keine "concurrency" an dieser Stelle. Der aufgerufene Workflow setzt sie je
# Vorgang an seinem Job; stuende sie hier zusaetzlich, wartete dieser Job auf den
# Lauf, zu dem er selbst gehoert.

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]

jobs:
  label-waechter:
    uses: f-reiser/reiser-flow/.github/workflows/label-waechter.yml@v2.0.0

    #  Ein aufgerufener Workflow kann Berechtigungen nur senken, nie erhoehen.
    #  Fehlen sie hier, kann er den Verstoss nur noch melden, nicht beheben.
    permissions:
      issues: write
      pull-requests: write

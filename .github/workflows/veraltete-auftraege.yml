name: Veraltete Auftraege zuruecknehmen

# Nimmt ein geschuetztes Label (Einarbeiten, Untersuche, Gegenlese) zurueck,
# wenn es laenger als fuenf Tage ununterbrochen an einem Vorgang haengt, ohne
# dass sich sichtbar etwas getan hat (f-reiser/reiser-flow#23).

on:
  schedule:
    - cron: "38 5 * * *"
  workflow_dispatch:

jobs:
  veraltete-auftraege:
    uses: f-reiser/reiser-flow/.github/workflows/veraltete-auftraege.yml@7409a64452c6a9bff47d6b8ba061d5ebf6271e58  # v2.3.0
    permissions:
      issues: write

name: Pruefung

# Laeuft bei jedem Push und bei jedem Pull Request. Ruft genau dasselbe
# Skript auf, das auch lokal laeuft (Makros/pruefe_alles.py) - damit
# koennen Arbeitsplatz und Pipeline nicht auseinanderlaufen.
#
# Was hier NICHT laufen kann:
#   Ebene 4/5  Selbsttest und Mutationstest brauchen echtes Excel.
#   Ebene 9    Fremde Gegenlese braucht ein Sprachmodell.
# Beides steht in Doku/Testebenen.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      # Beide auf Node 24. Mit checkout@v4 / setup-python@v5 haengte GitHub
      # jedem gruenen Lauf eine Deprecation-Warnung an - und eine Warnung,
      # die immer da steht, liest nach kurzer Zeit niemand mehr. Dann faellt
      # auch die echte nicht mehr auf.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python -m pip install --upgrade pip openpyxl

      - name: Alle automatisierbaren Pruefebenen
        run: python Makros/pruefe_alles.py

      #  Die Zuordnung entscheidet, an welchem Vorgang der naechste
      #  unbeaufsichtigte Lauf weiterarbeitet. Ein Fehler darin faellt sonst
      #  erst auf, wenn ein abgebrochener Vorgang doppelt angefangen wird.
      - name: Zuordnung Vorgang zu Branch
        run: python .github/zuordnung.py --selbsttest

      #  Modell und Aufwand entscheiden, was ein Lauf kostet. Ein Fehler in der
      #  Zuordnung von Label zu Modell faellt sonst erst an der Rechnung auf.
      - name: Modellwahl aus den Labels
        run: python .github/modellwahl.py --selbsttest

name: Pruefung

# Laeuft bei jedem Push und bei jedem Pull Request. Ruft genau dasselbe Skript
# auf, das auch lokal laeuft (Makros/pruefe_alles.py) - damit koennen Arbeitsplatz
# und Pipeline nicht auseinanderlaufen.
#
# Was hier NICHT laufen kann:
#   Ebene 4/5  Selbsttest und Mutationstest brauchen echtes Excel.
#   Ebene 9    Fremde Gegenlese braucht ein Sprachmodell.
# Beides steht in Doku/Testebenen.md.
#
# Hier steht nur noch, WAS dieses Projekt prueft. Die Selbsttests der gemeinsamen
# Skripte laufen dort, wo diese Skripte liegen und geaendert werden - in
# f-reiser/reiser-flow. Dieses Projekt haette nichts davon, sie bei jedem Push
# mitzunehmen.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefung:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Beide auf Node 24. Mit checkout@v4 / setup-python@v5 haengte GitHub
      # jedem gruenen Lauf eine Deprecation-Warnung an - und eine Warnung,
      # die immer da steht, liest nach kurzer Zeit niemand mehr. Dann faellt
      # auch die echte nicht mehr auf.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python -m pip install --upgrade pip openpyxl

      - name: Alle automatisierbaren Pruefebenen
        run: python Makros/pruefe_alles.py

  #  Das Ergebnis dort hinterlassen, wo ein Folgelauf ohnehin nachsieht: im
  #  Fortschrittskommentar des Vorgangs. Ein Lauf, der eine angefangene Arbeit
  #  aufnimmt, muss als Erstes wissen, ob der Branch zuletzt gruen stand -
  #  diese Antwort aus dem Actions-Verlauf zusammenzusuchen kostet Modellzeit.
  #
  #  "if: always()" ist nicht optional: Gerade das ROTE Ergebnis soll ankommen.
  vermerken:
    needs: pruefung
    if: always()
    uses: f-reiser/reiser-flow/.github/workflows/pruefung-vermerken.yml@20f802ad52419629091c043170c615b3e5f4e9b1  # reiser-flow--v2.2.0
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      ergebnis: ${{ needs.pruefung.result }}

name: Claude-Aufgaben

# Arbeitet alle vier Stunden Vorgaenge ab, die ein Auftragslabel tragen - Issues
# wie Pull Requests. Laeuft auf GitHub-Runnern und damit unabhaengig davon, ob der
# Rechner des Nutzers an ist.
#
# Was der Lauf tut, steht NICHT hier, sondern in f-reiser/reiser-flow: der
# Workflow selbst und die Skills, nach denen er arbeitet. Eine Quelle fuer alle
# Projekte; sonst altert dieselbe Regel in jedem Repository getrennt. Hier steht
# nur, WANN er laeuft und was an diesem Projekt besonders ist.
#
# GitHub startet geplante Laeufe nur vom Standardbranch - diese Datei wirkt also
# erst, wenn sie in main liegt.

on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

jobs:
  claude-aufgaben:
    uses: f-reiser/reiser-flow/.github/workflows/claude-aufgaben.yml@7409a64452c6a9bff47d6b8ba061d5ebf6271e58  # v2.3.0

    #  Ein aufgerufener Workflow kann Berechtigungen nur senken, nie erhoehen -
    #  was hier fehlt, bekommt er auch dann nicht, wenn er es selbst anfordert.
    #  "actions: read" ist die, die man am leichtesten vergisst und am spaetesten
    #  merkt: ohne sie scheitert erst das Abwarten der CI nach dem Push, wenn der
    #  Lauf schon gearbeitet und gekostet hat.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    with:
      #  Alles Allgemeine steht in den Skills, alles Projekteigene in CLAUDE.md.
      #  Hier gehoert nur hinein, was das Modell sonst uebersieht - und das ist
      #  genau die eine Regel, deren Bruch nicht auffaellt, sondern Inhalt
      #  zerstoert: Ein Edit-Werkzeug schreibt UTF-8 zurueck und macht aus jedem
      #  Umlaut U+FFFD.
      projektregeln: |
        Die cp1252-Regel fuer Makros/*.bas in CLAUDE.md gilt ausnahmslos. Ein
        Verstoss dagegen faellt nicht auf, sondern zerstoert den Dateiinhalt -
        lies die Regel dort nach, bevor du eine .bas-Datei anfasst.

    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
